<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>v1 · face tracking only</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>Version 1 — it can see your face</h1>
      <p class="sub">
        The webcam finds 478 points on your face and works out which way your head is pointing. That is all it does.
        There is nothing to select and nothing to say.
      </p>
      <div class="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <p id="status">Camera off.</p>
      </div>
      <button id="start">Turn the camera on</button>
      <dl id="readout">
        <div><dt>face found</dt><dd id="found">no</dd></div>
        <div><dt>looking across</dt><dd id="yaw">—</dd></div>
        <div><dt>looking up / down</dt><dd id="pitch">—</dd></div>
        <div><dt>points tracked</dt><dd id="count">0</dd></div>
      </dl>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
