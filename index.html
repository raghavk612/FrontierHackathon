<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>v2 · pointing and picking</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>Version 2 — your head moves a pointer</h1>
      <p class="sub">
        Turn your head to move the dot, hold it on a word for a second, and the computer says it. No calibration, no
        smoothing — the pointer goes straight from the head angle to the screen. Try to hit the word you actually want.
      </p>
      <div class="stage">
        <video id="video" playsinline muted></video>
        <div id="board"></div>
        <div id="cursor"></div>
        <p id="status">Camera off.</p>
      </div>
      <div class="row">
        <button id="start">Turn the camera on</button>
        <p class="said">last said: <strong id="said">nothing yet</strong></p>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
